name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=dev
      - run: npm test

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in *.sh; do bash -n "$f"; done
      - name: ShellCheck (advisory - shows warnings but doesn't fail the build)
        continue-on-error: true
        run: shellcheck --severity=warning *.sh

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t squadron-dashboard:ci .
      - name: Container answers /healthz
        run: |
          mkdir -p data   # created by root on the host, like a first `docker compose up`
          sudo chown root:root data
          docker run -d --name sqn -p 3000:3000 -v "$PWD/data:/app/data" squadron-dashboard:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              UID_MAIN="$(docker exec sqn awk '/^Uid:/{print $2}' /proc/1/status)"   # the app process itself, not the exec shell
              echo; echo "app runs as uid: $UID_MAIN"
              test "$UID_MAIN" != "0" && exit 0
              echo "the app should not run as root"; exit 1
            fi
            sleep 1
          done
          docker logs sqn
          exit 1
