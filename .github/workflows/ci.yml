name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=dev
      - run: npm test

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: for f in *.sh; do bash -n "$f"; done
      - name: ShellCheck (advisory - shows warnings but doesn't fail the build)
        continue-on-error: true
        run: shellcheck --severity=warning *.sh

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t squadron-dashboard:ci .
      - name: Container answers /healthz
        run: |
          docker run -d --name sqn -p 3000:3000 squadron-dashboard:ci
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3000/healthz && exit 0
            sleep 1
          done
          docker logs sqn
          exit 1
