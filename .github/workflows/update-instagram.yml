name: Update Instagram Widget

on:
  schedule:
    - cron: "0 10 */3 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get SociableKIT widget
        env:
          SOCIABLEKIT_API_KEY: ${{ secrets.SOCIABLEKIT_API_KEY }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${SOCIABLEKIT_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.sociablekit.com/v1/widgets/25714430" \
            -o widget.json

          echo "Widget information retrieved successfully."

      - name: Attempt SociableKIT widget update
        env:
          SOCIABLEKIT_API_KEY: ${{ secrets.SOCIABLEKIT_API_KEY }}
        run: |
          echo "Attempting to trigger a widget update..."

          curl --fail-with-body \
            -X PATCH \
            -H "Authorization: Bearer ${SOCIABLEKIT_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            "https://api.sociablekit.com/v1/widgets/25714430" \
            -d '{}' \
            -o update-response.json

          echo "SociableKIT update request completed."
          cat update-response.json

      - name: Get feed URL
        id: widget
        run: |
          FEED_URL=$(python -c "import json; print(json.load(open('widget.json'))['feed_url'])")
          LAST_SYNCED=$(python -c "import json; print(json.load(open('widget.json')).get('last_synced_at', 'unknown'))")

          echo "feed_url=$FEED_URL" >> "$GITHUB_OUTPUT"
          echo "last_synced_at=$LAST_SYNCED" >> "$GITHUB_OUTPUT"

          echo "Last known SociableKIT sync: $LAST_SYNCED"
          echo "Feed URL: $FEED_URL"

      - name: Download Instagram feed
        run: |
          mkdir -p data

          curl --fail-with-body \
            -H "Accept: application/json" \
            "${{ steps.widget.outputs.feed_url }}" \
            -o data/instagram.json

          echo "Instagram feed downloaded successfully."

      - name: Remove temporary files
        run: |
          rm -f widget.json
          rm -f update-response.json

      - name: Commit updated Instagram data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/instagram.json

          if git diff --cached --quiet; then
            echo "No Instagram data changes detected."
          else
            git commit -m "Update Instagram feed"
            git push
            echo "Instagram data updated and committed."
          fi
