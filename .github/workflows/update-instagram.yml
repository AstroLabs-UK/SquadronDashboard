name: Update Instagram Widget

on:
  schedule:
    # Run every day at 10:00 UTC
    - cron: "0 10 * * *"

  # Allow manual runs from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-instagram:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Fetch SociableKIT widget information
        env:
          SOCIABLEKIT_API_KEY: ${{ secrets.SOCIABLEKIT_API_KEY }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${SOCIABLEKIT_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.sociablekit.com/v1/widgets/25714430" \
            -o widget.json

          echo "SociableKIT widget information retrieved successfully."

      - name: Get feed URL
        id: widget
        run: |
          FEED_URL=$(python -c "import json; print(json.load(open('widget.json'))['feed_url'])")
          LAST_SYNCED=$(python -c "import json; print(json.load(open('widget.json')).get('last_synced_at', 'unknown'))")

          echo "feed_url=$FEED_URL" >> "$GITHUB_OUTPUT"
          echo "last_synced_at=$LAST_SYNCED" >> "$GITHUB_OUTPUT"

          echo "SociableKIT last synced: $LAST_SYNCED"

      - name: Download Instagram feed
        run: |
          mkdir -p data

          curl --fail-with-body \
            -H "Accept: application/json" \
            "${{ steps.widget.outputs.feed_url }}" \
            -o data/instagram.json

          echo "Instagram feed downloaded successfully."

      - name: Remove temporary files
        run: |
          rm -f widget.json

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- data/instagram.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Instagram data changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Instagram data has changed."
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/instagram.json
          git commit -m "Update Instagram feed"
          git push

          echo "Instagram feed updated and committed successfully."
