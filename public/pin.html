<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Enter PIN – Squadron Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex">
<style>
  :root {
    --raf-navy: #00205B;
    --deep-navy: #071525;
    --raf-blue: #0066A1;
    --light-blue: #D9EAF3;
    --white: #FFFFFF;
    --off-white: #F4F6F8;
    --raf-red: #C8102E;
    --muted: #667788;
    --border: #D5DDE5;
  }
  body[data-theme="acf"] {
    --raf-navy: #003D2C;
    --deep-navy: #00261C;
    --raf-blue: #1B6B4A;
    --light-blue: #E4F0E8;
    --off-white: #F3F7F4;
    --raf-red: #C4A35A;
    --border: #C5D4C9;
  }
  body[data-theme="scc"] {
    --raf-navy: #0A1628; --deep-navy: #061018; --raf-blue: #00A3E0;
    --light-blue: #E6F6FC; --off-white: #F2F5F8; --raf-red: #F5C400; --border: #C5D0DA;
  }
  body[data-theme="ccf"] {
    --raf-navy: #1A3A6E; --deep-navy: #0F2448; --raf-blue: #2E5A8F;
    --light-blue: #E8EEF6; --off-white: #F4F6FA; --raf-red: #C9A227; --border: #C8D0DC;
  }
  body[data-theme="vcc"] {
    --raf-navy: #0D2137; --deep-navy: #081624; --raf-blue: #1A3D5C;
    --light-blue: #E8EEF3; --off-white: #F2F5F8; --raf-red: #2E5A3C; --border: #C5CED6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Inter", Arial, Helvetica, sans-serif;
    max-width: 640px;
    margin: 0 auto;
    padding: 0 0 40px 0;
    background: var(--off-white);
    color: var(--deep-navy);
    min-height: 100vh;
  }
  header {
    background: var(--raf-navy);
    color: var(--white);
    padding: 18px 20px;
    border-bottom: 3px solid var(--raf-blue);
  }
  header .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-size: 11px;
    font-weight: 700;
    color: var(--light-blue);
  }
  header h1 { margin: 4px 0 0 0; font-size: 20px; font-weight: 700; }
  .content { padding: 0 20px; }

  .panel {
    margin-top: 28px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 24px 20px 28px;
    box-shadow: 0 2px 8px rgba(7, 21, 37, 0.06);
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 8px 0;
    color: var(--raf-navy);
    border-bottom: 2px solid var(--raf-navy);
    padding-bottom: 8px;
  }
  .hint {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 18px 0;
    line-height: 1.45;
  }
  label {
    display: block;
    margin-top: 4px;
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 12px 12px;
    margin-top: 6px;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.35em;
    text-align: center;
    font-family: inherit;
    font-variant-numeric: tabular-nums;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--deep-navy);
  }
  input:focus { border-color: var(--raf-blue); outline: none; }
  input.error {
    border-color: var(--raf-red);
    animation: shake 0.4s ease;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  button.primary {
    width: 100%;
    margin-top: 16px;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    border: 1px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    background: var(--raf-navy);
    color: var(--white);
    font-family: inherit;
  }
  button.primary:hover:not(:disabled) { background: var(--raf-blue); }
  button.primary:disabled {
    background: #C9D1D9;
    color: #8A96A3;
    cursor: not-allowed;
  }
  #status {
    margin-top: 14px;
    min-height: 20px;
    font-weight: 700;
    font-size: 14px;
    color: var(--raf-navy);
    text-align: center;
  }
  #status.error { color: var(--raf-red); }
  #status.ok { color: var(--raf-navy); }
  .footer-note {
    margin-top: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="unitEyebrow">Royal Air Force Air Cadets</div>
  <h1 id="unlockTitle">Editor unlock</h1>
</header>

<div class="content">
  <div class="panel">
    <h2>Enter PIN</h2>
    <p class="hint">Enter the editor PIN to open the settings page. The PIN is checked on the server and is not stored in this browser.</p>

    <form id="pinForm" autocomplete="off" novalidate>
      <label for="pin">PIN</label>
      <input
        id="pin"
        type="password"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="32"
        placeholder="••••"
        autocomplete="one-time-code"
        autocapitalize="off"
        autocorrect="off"
        spellcheck="false"
        autofocus
      >
      <button type="submit" class="primary" id="submitBtn">Unlock</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
  </div>
  <p class="footer-note">Squadron Dashboard · protected access</p>
</div>

<script>
(function () {
  const form = document.getElementById('pinForm');
  const input = document.getElementById('pin');
  const btn = document.getElementById('submitBtn');
  const status = document.getElementById('status');

  function applyPinChrome(theme) {
    let t = String(theme || 'rafac').toLowerCase();
    if (t === 'army') t = 'acf';
    if (t === 'sea') t = 'scc';
    if (!['rafac','acf','scc','ccf','vcc'].includes(t)) t = 'rafac';
    document.body.setAttribute('data-theme', t);
    const labels = { rafac: 'Royal Air Force Air Cadets', acf: 'Army Cadets', scc: 'Sea Cadets', ccf: 'Combined Cadet Force', vcc: 'Volunteer Cadet Corps' };
    const eye = document.getElementById('unitEyebrow');
    if (eye) eye.textContent = labels[t];
    document.title = 'Enter PIN – ' + labels[t];
  }

  // Public settings include theme so the PIN screen matches the unit branding
  fetch('/api/data', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => applyPinChrome(d && d.theme))
    .catch(() => {});

  function nextUrl() {
    try {
      const u = new URL(window.location.href);
      const n = u.searchParams.get('next');
      if (n && n.startsWith('/') && !n.startsWith('//')) return n;
    } catch (e) {}
    return '/edit';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pin = (input.value || '').trim();
    if (!pin) {
      status.className = 'error';
      status.textContent = 'Please enter the PIN.';
      input.focus();
      return;
    }
    btn.disabled = true;
    status.className = '';
    status.textContent = 'Checking…';
    input.classList.remove('error');

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        credentials: 'same-origin',
        body: JSON.stringify({ pin })
      });
      const body = await res.json().catch(() => ({}));
      if (res.ok && body.ok) {
        status.className = 'ok';
        status.textContent = 'Unlocked – opening editor…';
        setTimeout(() => { window.location.replace(nextUrl()); }, 350);
        return;
      }
      status.className = 'error';
      status.textContent = body.error || 'Incorrect PIN';
      input.classList.add('error');
      input.select();
      input.focus();
    } catch (err) {
      status.className = 'error';
      status.textContent = 'Could not reach the server.';
    } finally {
      btn.disabled = false;
    }
  });

  input.addEventListener('input', () => {
    input.classList.remove('error');
    if (status.classList.contains('error')) {
      status.className = '';
      status.textContent = '';
    }
  });
})();
</script>
</body>
</html>
