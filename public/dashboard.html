<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Squadron Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --raf-navy: #00205B;
    --deep-navy: #071525;
    --raf-blue: #0066A1;
    --light-blue: #D9EAF3;
    --white: #FFFFFF;
    --off-white: #F4F6F8;
    --raf-red: #C8102E;
    --muted: #667788;
    --border: #D5DDE5;
  }
  * { box-sizing: border-box; }
  /* Hide Elfsight's own branding/toolbar wherever their widget markup allows it */
  .eapps-widget-toolbar, .global-styles, a[href*="elfsight.com"] { display: none !important; }
  body {
    margin: 0;
    background: var(--off-white);
    color: var(--deep-navy);
    font-family: "Inter", Arial, Helvetica, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px;
    background: var(--raf-navy);
    color: var(--white);
    border-bottom: 3px solid var(--raf-blue);
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .roundel { width: 48px; height: 48px; flex-shrink: 0; }
  .brand-text h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: 0.01em; }
  .clockbox { text-align: right; }
  #clock { font-size: 32px; font-weight: 700; letter-spacing: 0.02em; }
  #date { font-size: 13px; color: var(--light-blue); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 3fr);
    gap: 16px;
    padding: 16px;
    min-height: 0;
  }
  .panel {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 20px 24px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 8px rgba(7, 21, 37, 0.08);
    min-height: 0;
  }
  .panel h2 {
    margin: 0 0 14px 0;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--raf-navy);
    border-bottom: 2px solid var(--raf-navy);
    padding-bottom: 8px;
  }

  /* Weather panel (always shown, left) */
  #weatherPanel { align-items: center; justify-content: center; text-align: center; }
  #weatherPanel h2 { align-self: flex-start; width: 100%; }
  #weatherContent { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; gap: 10px; }
  #weatherContent .temp { font-size: 96px; font-weight: 700; color: var(--raf-navy); line-height: 1; }
  #weatherContent .feels { font-size: 18px; color: var(--muted); }
  #weatherContent .condition { font-size: 26px; font-weight: 700; color: var(--deep-navy); }
  #weatherWidgetWrap { display: none; flex: 1; width: 100%; align-items: center; justify-content: center; overflow: hidden; }

  /* Rotating panel (right) */
  #rotatingPanel { position: relative; }
  .rotate-pane { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .rotate-pane.active { display: flex; }
  .rotate-pane ul { list-style: none; padding: 0; margin: 0; overflow: hidden; flex: 1; min-height: 0; }

  /* News cards – scraped BBC headlines */
  #newsPane { padding: 4px 0 0 0; gap: 0; }
  #newsList {
    flex: 1; min-height: 0; overflow: hidden;
    display: grid;
    grid-template-columns: 1fr;
    grid-auto-rows: minmax(0, 1fr);
    gap: 12px;
  }
  /* Horizontal cards: small thumbnail on the left, headline + description always visible on the right */
  .news-card {
    display: flex; flex-direction: row; align-items: stretch;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    min-height: 0;
    box-shadow: 0 2px 8px rgba(7, 21, 37, 0.06);
  }
  .news-card .thumb {
    flex: 0 0 34%;
    width: 34%;
    height: 100%;
    min-height: 0;
    object-fit: cover;
    background: var(--off-white);
    display: block;
  }
  .news-card .thumb.placeholder {
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 12px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    background: linear-gradient(135deg, #e8eef4, #d5dde5);
  }
  .news-card .body {
    flex: 1; min-width: 0; min-height: 0; overflow: hidden;
    padding: 10px 14px; display: flex; flex-direction: column; justify-content: center; gap: 6px;
  }
  .news-card .title {
    font-weight: 700; color: var(--raf-navy); font-size: clamp(14px, 2vh, 19px);
    line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .news-card .desc {
    color: var(--muted); font-size: clamp(12px, 1.5vh, 15px); line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .news-card .source {
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--raf-blue);
  }
  #newsStamp {
    flex-shrink: 0; font-size: 11px; color: var(--muted); margin-top: 8px; text-align: right;
  }
  #newsStamp.stale { color: var(--raf-red); }

  /* Leaderboard: individual + flight side by side — fill available vertical space with taller rows */
  #lbPane { flex-direction: row; gap: 24px; }
  .lb-col { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .lb-col h3 {
    margin: 0 0 10px 0; font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--raf-blue); flex-shrink: 0;
  }
  /* Text fills the row height: more font, less empty padding (row size stays similar) */
  .lb-col table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: clamp(15px, 3vh, 22px); flex: 1; }
  .lb-col thead th { background: var(--raf-navy); color: var(--white); text-align: left; padding: clamp(5px, 0.9vh, 10px) 12px; font-size: 0.72em; text-transform: uppercase; letter-spacing: 0.06em; }
  .lb-col thead th.num { text-align: right; }
  .lb-col td { padding: clamp(5px, 0.9vh, 10px) 12px; line-height: 1.2; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lb-col tr:nth-child(even) td { background: var(--off-white); }
  .lb-col td.rank, .lb-col th:first-child { width: 48px; }
  .lb-col td.rank { color: var(--raf-blue); font-weight: 700; }
  .lb-col th:last-child, .lb-col td.points { width: 90px; }
  .lb-col td.points { text-align: right; font-weight: 700; color: var(--raf-navy); }
  .lb-unavailable { color: var(--muted); font-size: 14px; padding: 12px 0; }
  @media (max-width: 700px) {
    #lbPane { flex-direction: column; }
  }

  #eventsPane li { margin-bottom: 14px; font-size: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  #eventsPane li .title { font-weight: 700; color: var(--raf-navy); }
  #eventsPane li .meta { color: var(--muted); font-size: 14px; margin-top: 2px; }
  #eventsLayout { flex: 1; display: flex; gap: 24px; min-height: 0; }
  #eventsList { flex: 1; min-width: 0; }
  #eventsSeeMore { flex: 0 0 34%; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; border-left: 1px solid var(--border); padding-left: 24px; }
  #eventsSeeMore .label { font-size: 15px; color: var(--muted); }

  /* Embed widgets (Instagram + any extra widgets added on /edit) fill their pane */
  .embed-pane { position: relative; padding: 0; }
  .embed-pane .insta-wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; }
  .embed-pane .insta-wrap iframe { display: block; width: 100%; height: 100%; border: none; }

  /* Chain of Command org tree */
  #cocPane { overflow: auto; }
  #cocPane .coc-tree {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 4px 0 8px;
  }
  #cocPane .coc-level {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    width: 100%;
  }
  #cocPane .coc-node-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #cocPane .coc-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-width: 90px;
    max-width: 130px;
  }
  #cocPane .coc-photo {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    object-fit: cover;
    background: var(--light-blue);
    border: 3px solid var(--raf-navy);
    margin-bottom: 6px;
  }
  #cocPane .coc-photo.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--raf-navy);
    font-weight: 700;
    font-size: 20px;
  }
  #cocPane .coc-rank {
    font-size: 12px;
    font-weight: 700;
    color: var(--raf-blue);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    line-height: 1.2;
  }
  #cocPane .coc-name {
    font-size: 14px;
    font-weight: 700;
    color: var(--deep-navy);
    line-height: 1.25;
    margin-top: 2px;
  }
  #cocPane .coc-children {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 2px solid var(--border);
    position: relative;
  }
  #cocPane .coc-children::before {
    content: '';
    position: absolute;
    top: -10px;
    left: 50%;
    width: 2px;
    height: 10px;
    background: var(--border);
  }
  #cocPane .coc-empty {
    color: var(--muted);
    text-align: center;
    padding: 24px;
    font-size: 16px;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body.compact #cocPane .coc-photo { width: 48px; height: 48px; border-width: 2px; }
  body.compact #cocPane .coc-photo.placeholder { font-size: 14px; }
  body.compact #cocPane .coc-rank { font-size: 10px; }
  body.compact #cocPane .coc-name { font-size: 12px; }

  #noWidgetsPane { align-items: center; justify-content: center; text-align: center; color: var(--muted); font-size: 16px; }

  /* Error fallback with QR */
  .error-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  .error-box p { color: var(--muted); font-size: 15px; max-width: 320px; margin: 0; }
  .qr-holder { padding: 8px; background: var(--white); border: 1px solid var(--border); border-radius: 4px; display: inline-flex; }
  .qr-holder img, .qr-holder canvas { display: block; }

  /* Important information banner - entire content (icon + title + description) scrolls
     horizontally as one message. Part of normal layout (pushes widgets up), zero space when hidden. */
  #infoBanner {
    display: none;
    align-items: center;
    margin: 0 16px 16px 16px;
    padding: 6px 0;
    background: var(--white);
    border: 1px solid var(--border);
    border-left: 6px solid var(--raf-red);
    border-radius: 3px;
    box-shadow: 0 2px 8px rgba(7, 21, 37, 0.08);
    min-width: 0;
    overflow: hidden;
  }
  #infoBanner.visible { display: flex; }
  #infoBanner .ticker { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
  #infoBanner .track { display: inline-flex; white-space: nowrap; will-change: transform; animation: bannerScroll var(--dur, 20s) linear infinite; }
  #infoBanner .group { display: inline-flex; align-items: center; flex-shrink: 0; padding-right: 80px; }
  #infoBanner .icon { font-size: 28px; line-height: 1; color: var(--raf-red); flex-shrink: 0; margin-right: 10px; }
  #infoBanner .title {
    margin: 0; font-size: 22px; font-weight: 700; text-transform: uppercase; white-space: nowrap;
    letter-spacing: 0.06em; color: var(--raf-red); flex-shrink: 0;
    padding-right: 14px; margin-right: 14px; border-right: 2px solid var(--border);
  }
  #infoBanner .message { font-size: 30px; font-weight: 600; color: #000000; line-height: 1.3; flex-shrink: 0; }
  @keyframes bannerScroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }


  /* Panel header: title on the left, small "last updated" stamp on the right */
  #rotatingTitle { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; }
  .stamp { font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: none; color: var(--muted); white-space: nowrap; }
  .stamp.stale { color: #B45F06; }
  #weatherStamp { margin-top: 6px; }

  /* Uniform: this week / next week */
  #uniformPane { flex-direction: row; gap: 24px; }
  .uni-col { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .uni-col h3 { margin: 0 0 10px 0; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--raf-blue); flex-shrink: 0; }
  .uni-next { border-left: 1px solid var(--border); padding-left: 24px; }
  .uni-next h3 { color: var(--raf-red); }
  .uni-item { padding: 8px 0 14px; border-bottom: 1px solid var(--border); }
  .uni-day { font-size: 14px; font-weight: 600; color: var(--muted); }
  .uni-what { font-size: clamp(20px, 4.4vh, 36px); font-weight: 800; color: var(--raf-navy); line-height: 1.15; margin-top: 3px; overflow-wrap: anywhere; }
  .uni-empty { color: var(--muted); font-size: 16px; padding: 10px 0; }
  @media (max-width: 700px) { #uniformPane { flex-direction: column; } .uni-next { border-left: 0; padding-left: 0; } }

  /* Message pushed from /edit: sits over everything until it runs out or is cleared */
  #notice { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(7, 21, 37, 0.74); align-items: center; justify-content: center; padding: 5vh 5vw; }
  #notice.visible { display: flex; }
  #notice .notice-card { background: var(--white); border-left: 14px solid var(--raf-red); border-radius: 4px; padding: 4vh 4vw; max-width: 92vw; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); }
  #notice .notice-title { color: var(--raf-red); font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; font-size: clamp(14px, 2.4vh, 26px); }
  #noticeText { color: #000; font-weight: 700; font-size: clamp(22px, 6vh, 64px); line-height: 1.25; margin-top: 1.5vh; overflow-wrap: anywhere; white-space: pre-wrap; }

  /* ================= Small-screen layout =================
     Used automatically on screens 800px wide or less / 500px tall or less (or when forced
     on /edit). Designed for a 480 x 300 screen, and everything scales from there: --u is
     "1px at 480x300" and grows/shrinks with the screen, so it also suits 320x240, 800x480
     and anything in between. Weather becomes a slim strip, the rotating panel takes the
     full width, and text/spacing are tightened. */
  body.compact {
    --u: min(0.2083vw, 0.3333vh);
    --fxs: max(7px, calc(9 * var(--u)));
    --fs: max(8px, calc(11 * var(--u)));
    --fm: max(9px, calc(13 * var(--u)));
    --fl: max(10px, calc(16 * var(--u)));
    --fxl: max(13px, calc(26 * var(--u)));
  }
  body.compact header { padding: calc(4 * var(--u)) calc(10 * var(--u)); border-bottom-width: 2px; gap: calc(8 * var(--u)); }
  body.compact .brand { gap: calc(8 * var(--u)); min-width: 0; }
  body.compact .brand-text { min-width: 0; }
  body.compact .roundel { width: calc(24 * var(--u)); height: calc(24 * var(--u)); }
  body.compact .brand-text h1 { font-size: var(--fl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.compact #clock { font-size: var(--fl); white-space: nowrap; }
  body.compact #date { display: none; }

  body.compact main {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    gap: calc(5 * var(--u));
    padding: calc(5 * var(--u)) calc(6 * var(--u));
  }
  body.compact .panel { padding: calc(5 * var(--u)) calc(8 * var(--u)); }
  body.compact .panel h2 {
    font-size: var(--fxs); margin: 0 0 calc(4 * var(--u)); padding-bottom: calc(3 * var(--u)); border-bottom-width: 1px;
  }

  /* Weather: one slim strip - temperature, feels-like and condition, place name on the right */
  body.compact #weatherPanel { flex-direction: row; align-items: center; justify-content: flex-start; gap: calc(10 * var(--u)); padding: calc(3 * var(--u)) calc(8 * var(--u)); text-align: left; }
  body.compact #weatherPanel h2 { order: 3; margin: 0 0 0 auto; padding: 0; border: 0; width: auto; align-self: center; text-align: right; }
  body.compact #weatherPanel h2 .wlabel, body.compact #weatherPanel h2 br { display: none; }
  body.compact #weatherContent { flex: 0 1 auto; flex-direction: row; align-items: baseline; gap: calc(10 * var(--u)); }
  body.compact #weatherContent .temp { font-size: var(--fxl); }
  body.compact #weatherContent .feels { font-size: var(--fs); }
  body.compact #weatherContent .condition { font-size: var(--fm); }

  /* Leaderboard: side by side; tighter rows so top 5 / top 3 still fit on small screens */
  body.compact #lbPane { flex-direction: row; gap: calc(8 * var(--u)); }
  body.compact .lb-col h3 { font-size: var(--fxs); margin-bottom: calc(2 * var(--u)); }
  body.compact .lb-col table { font-size: var(--fs); }
  body.compact .lb-col thead th { font-size: var(--fxs); padding: calc(2 * var(--u)) calc(4 * var(--u)); letter-spacing: 0.02em; }
  body.compact .lb-col td { padding: calc(2 * var(--u)) calc(4 * var(--u)); }
  body.compact .lb-col td.rank, body.compact .lb-col th:first-child { width: calc(20 * var(--u)); }
  body.compact .lb-col th:last-child, body.compact .lb-col td.points { width: max(38px, calc(46 * var(--u))); }
  body.compact .lb-unavailable { font-size: var(--fs); padding: calc(4 * var(--u)) 0; }


  body.compact #eventsPane li { font-size: var(--fm); margin-bottom: calc(5 * var(--u)); padding-bottom: calc(4 * var(--u)); }
  body.compact #eventsPane li .meta { font-size: var(--fs); margin-top: 1px; }
  body.compact #eventsLayout { gap: calc(8 * var(--u)); }
  body.compact #eventsSeeMore { flex: 0 0 calc(100 * var(--u)); padding-left: calc(8 * var(--u)); gap: calc(4 * var(--u)); }
  body.compact #eventsSeeMore .label { font-size: var(--fxs); }
  body.compact .qr-holder { padding: calc(3 * var(--u)); }
  body.compact .error-box { gap: calc(6 * var(--u)); }
  body.compact .error-box p { font-size: var(--fs); max-width: none; }
  body.compact #noWidgetsPane { font-size: var(--fm); }


  body.compact .stamp { font-size: var(--fxs); }
  body.compact #weatherStamp { display: none; }
  body.compact #uniformPane { flex-direction: row; gap: calc(8 * var(--u)); }
  body.compact .uni-next { padding-left: calc(8 * var(--u)); border-left: 1px solid var(--border); }
  body.compact .uni-col h3 { font-size: var(--fxs); margin-bottom: calc(2 * var(--u)); }
  body.compact .uni-item { padding: calc(3 * var(--u)) 0 calc(4 * var(--u)); }
  body.compact .uni-day { font-size: var(--fs); }
  body.compact .uni-what { font-size: var(--fl); margin-top: 0; }
  body.compact .uni-empty { font-size: var(--fs); padding: calc(3 * var(--u)) 0; }

  body.compact #infoBanner { margin: 0 calc(6 * var(--u)) calc(6 * var(--u)); padding: calc(2 * var(--u)) 0; border-left-width: 4px; }
  body.compact #infoBanner .icon { font-size: var(--fl); margin-right: calc(4 * var(--u)); }
  body.compact #infoBanner .title { font-size: var(--fs); padding-right: calc(6 * var(--u)); margin-right: calc(6 * var(--u)); }
  body.compact #infoBanner .message { font-size: max(11px, calc(18 * var(--u))); }
  body.compact #infoBanner .group { padding-right: calc(40 * var(--u)); }

  #sourceBanner {
    display: none;
    background: #B45F06;
    color: #fff;
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 12px;
    letter-spacing: 0.02em;
  }
  #sourceBanner.show { display: block; }
  .next-highlight {
    background: var(--light-blue, #D9EAF3);
    border-left: 4px solid var(--raf-navy, #00205B);
    padding: 12px 14px;
    margin-bottom: 16px;
    border-radius: 2px;
  }
  .next-highlight .eyebrow {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--raf-blue, #0066A1); margin-bottom: 4px;
  }
  .next-highlight .title { font-size: 18px; font-weight: 700; color: var(--raf-navy, #00205B); }
  .next-highlight .meta { font-size: 14px; color: var(--muted, #667788); margin-top: 2px; }

</style>
</head>
<body>
<div id="sourceBanner" role="status"></div>
  <header>
    <div class="brand">
      <img class="roundel" src="/roundel.png" alt="RAF Air Cadets roundel">
      <div class="brand-text"><h1 id="squadronName">Your Squadron</h1></div>
    </div>
    <div class="clockbox">
      <div id="clock">--:--</div>
      <div id="date"></div>
    </div>
  </header>
  <script>
  /* Early local clock — runs even if later dashboard script hits an error */
  (function earlyClock() {
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function paint() {
      try {
        var d = new Date();
        var c = document.getElementById('clock');
        var dateEl = document.getElementById('date');
        if (c) c.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
        if (dateEl) {
          try {
            dateEl.textContent = d.toLocaleDateString('en-GB', {
              weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            });
          } catch (e2) {
            dateEl.textContent = d.toDateString();
          }
        }
      } catch (e) {}
    }
    paint();
    setInterval(paint, 1000);
  })();
  </script>

<script>
let errorReportUrl = '';
let lastInstagramEmbedCode = '';
let lastWeatherEmbedCode = '';
let weatherEmbedActive = false;
let latestEvents = [];
let eventsSeeMoreUrl = '';
let eventsPages = [];
let eventsPageIndex = 0;
let isCompact = false;               // small-screen layout active?
let layoutSetting = 'auto';          // auto | full | compact (from /edit)
let widgetFlags = { leaderboard: true, news: true, events: true, instagram: true, uniform: true, chainOfCommand: false };
let latestUniform = { thisWeek: [], nextWeek: [] };
let eventsLoaded = false;
let customWidgets = [];              // extra embed widgets from /edit
const customMounted = {};            // widget id -> embed code currently mounted
let weatherEmbedCodeSetting = '';
let currentBannerMessage = null;
let latestChainOfCommand = { people: [] };

// Snapshot each rotating pane's original markup so it can be restored after an
// error state (showError fully replaces a pane's contents with an error box).
const paneTemplates = {};
(function initPaneTemplates() {
  try {
    const lb = document.getElementById('lbPane');
    if (lb) paneTemplates.lbPane = lb.innerHTML;
  } catch (e) { console.warn('pane template init', e); }
})();
function ensurePaneSkeleton(paneId) {
  const pane = document.getElementById(paneId);
  if (!pane) return null;
  if (pane.querySelector('.error-box') && paneTemplates[paneId]) {
    pane.innerHTML = paneTemplates[paneId];
  }
  return pane;
}


// Events pane shows up to 3 events per page and cycles through them. The "see all
// events" QR code sits permanently on the right-hand side of the pane.
let eventsSignature = '';
let renderedQrKey = null;
let eventsTimer = null;

function rebuildEventsPages() {
  // loadSettings() runs every 15 seconds - only rebuild when events or the QR link
  // actually changed, otherwise the page index gets reset every time.
  const signature = JSON.stringify([latestEvents, eventsSeeMoreUrl]);
  if (signature === eventsSignature) return;
  eventsSignature = signature;

  const chunks = [];
  for (let i = 0; i < latestEvents.length; i += 3) {
    chunks.push(latestEvents.slice(i, i + 3));
  }
  if (chunks.length === 0) chunks.push([]);
  eventsPages = chunks;
  eventsPageIndex = 0;
  renderEventsPage();
}

function renderEventsPage() {
  const ul = document.getElementById('eventsList');
  const seeMore = document.getElementById('eventsSeeMore');
  const events = eventsPages[eventsPageIndex] || [];
  ul.innerHTML = events.map(e =>
    `<li><div class="title">${esc(e.title)}</div><div class="meta">${[e.date, e.detail].filter(x => x && String(x).trim()).map(esc).join(' &middot; ')}</div></li>`).join('')
    || '<li><div class="meta">No events added yet - add some on /edit</div></li>';

  if (eventsSeeMoreUrl) {
    seeMore.style.display = 'flex';
    // Big on a room-sized screen, small (and scaled with the screen) in compact layout
    const size = isCompact ? Math.max(48, Math.round(84 * unitPx())) : 240;
    const key = eventsSeeMoreUrl + '|' + size;
    if (renderedQrKey !== key) {
      makeQr('eventsSeeMoreQr', eventsSeeMoreUrl, size);
      renderedQrKey = key;
    }
  } else {
    seeMore.style.display = 'none';
    renderedQrKey = null;
  }
}

// Restarted each time the events pane comes into view, so page 1 always shows first
function startEventsRotation() {
  clearInterval(eventsTimer);
  eventsPageIndex = 0;
  renderEventsPage();
  if (eventsPages.length > 1) {
    eventsTimer = setInterval(() => {
      eventsPageIndex = (eventsPageIndex + 1) % eventsPages.length;
      renderEventsPage();
    }, 10000);
  }
}

// Renders a pasted widget embed snippet (script + div, e.g. Elfsight or a
// weatherwidget.io embed) into a container. Scripts inserted via innerHTML don't
// execute on their own, so each <script> tag is recreated manually. Mounted once
// when the code changes on /edit - NOT recreated every time the carousel switches
// back to this pane.
function mountEmbedCode(containerId, embedCode) {
  const wrap = document.getElementById(containerId);
  wrap.innerHTML = '';
  const temp = document.createElement('div');
  temp.innerHTML = embedCode;
  [...temp.childNodes].forEach(node => {
    if (node.tagName === 'SCRIPT') {
      const s = document.createElement('script');
      if (node.src) { s.src = node.src; s.async = true; }
      else { s.textContent = node.textContent; }
      wrap.appendChild(s);
    } else {
      wrap.appendChild(node);
    }
  });
}

function mountInstagramEmbed(embedCode) { mountEmbedCode('instaWrap', embedCode); }

// Force the embedded widget to refresh on its own schedule (every 10 minutes),
// independent of how often the carousel happens to bring this pane into view.
function refreshInstagramEmbed() {
  if (lastInstagramEmbedCode) mountInstagramEmbed(lastInstagramEmbedCode);
  Object.keys(customMounted).forEach(id => mountEmbedCode('cw-' + id + '-wrap', customMounted[id]));
}
setInterval(refreshInstagramEmbed, 10 * 60 * 1000);

// Local clock — independent of network/settings so the header always updates.
function tick() {
  try {
    const now = new Date();
    const clockEl = document.getElementById('clock');
    const dateEl = document.getElementById('date');
    if (clockEl) {
      clockEl.textContent = now.toLocaleTimeString('en-GB', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });
    }
    if (dateEl) {
      dateEl.textContent = now.toLocaleDateString('en-GB', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }
  } catch (e) {
    console.warn('clock tick failed', e);
  }
}
tick();
setInterval(tick, 1000);

function makeQr(containerId, url, size) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = '';
  // The QR library comes from a CDN - if the Pi is offline it won't have loaded, and that
  // must never stop the rest of the dashboard working.
  if (typeof QRCode === 'undefined') return;
  try { new QRCode(el, { text: url, width: size || 120, height: size || 120 }); } catch (e) { console.error('QR failed', e); }
}

function qrSizeFor(referenceEl) {
  // Size the QR as large as the panel comfortably allows, capped for readability on a room-sized screen
  const w = referenceEl.clientWidth || 300;
  const h = referenceEl.clientHeight || 300;
  return Math.max(100, Math.min(w * 0.7, h * 0.6, 320));
}

// Everything that comes from settings or the leaderboard sheet is escaped before it goes into
// the page, so a name like <img onerror=...> shows up as text instead of running.
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function showError(containerEl, label, reason) {
  const detail = (reason && String(reason).trim()) || '';
  const message = detail
    ? `This panel isn't working (${esc(label)}): ${esc(detail)}`
    : errorReportUrl
      ? `This panel isn't working right now — scan the QR code to report it.`
      : `This panel isn't working right now (${esc(label)}).`;
  if (!errorReportUrl) {
    containerEl.innerHTML = `<div class="error-box"><p>${message}</p></div>`;
    return;
  }
  containerEl.innerHTML = `<div class="error-box"><div class="qr-holder" id="qr-${containerEl.id}"></div><p>${message}</p></div>`;
  makeQr('qr-' + containerEl.id, errorReportUrl, qrSizeFor(containerEl));
}

async function apiJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || data.error || ('HTTP ' + r.status));
  return data;
}

const WEATHER_CODES = {0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Overcast',45:'Foggy',48:'Foggy',53:'Drizzle',55:'Heavy Drizzle',
51:'Drizzling',61:'Raining',63:'Raining',65:'Raining Heavily',71:'Snowing',73:'Snowing',75:'Snowing Heavily',
80:'Showers',95:'Thunderstorm'};

// Banner: icon + title + description scroll together. Two identical halves for a seamless loop.
let lastBannerKey = null;
let currentBannerTitle = 'IMPORTANT INFORMATION';
function updateBannerTicker(message, title) {
  const track = document.getElementById('infoBannerTrack');
  const ticker = document.getElementById('infoBannerTicker');
  if (title) currentBannerTitle = title;
  const key = currentBannerTitle + '|' + message + '|' + ticker.clientWidth;
  if (key === lastBannerKey) return;
  lastBannerKey = key;

  const makeUnit = () => {
    const g = document.createElement('div');
    g.className = 'group';
    g.innerHTML = `<span class="icon">⚠</span><span class="title"></span><span class="message"></span>`;
    g.querySelector('.title').textContent = currentBannerTitle;
    g.querySelector('.message').textContent = message;
    return g;
  };
  const makeHalf = (n) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:inline-flex;flex-shrink:0';
    for (let i = 0; i < n; i++) wrap.appendChild(makeUnit());
    return wrap;
  };

  track.style.animation = 'none';
  track.innerHTML = '';
  const probe = makeUnit();
  track.appendChild(probe);
  const oneWidth = probe.getBoundingClientRect().width || 1;
  const copies = Math.max(1, Math.ceil((ticker.clientWidth || 800) / oneWidth));
  track.innerHTML = '';
  track.appendChild(makeHalf(copies));
  track.appendChild(makeHalf(copies));
  const speed = isCompact ? 55 * unitPx() : 90;
  track.style.setProperty('--dur', Math.max(8, (oneWidth * copies) / speed) + 's');
  void track.offsetWidth;
  track.style.animation = '';
}

// 1px at 480x300 - the same scale unit the compact CSS uses (--u)
function unitPx() { return Math.min(window.innerWidth * 0.002083, window.innerHeight * 0.003333); }

// Picks the layout for this screen: automatic (small screens get the compact layout),
// or forced either way from /edit.
function applyLayout() {
  const small = window.innerWidth <= 800 || window.innerHeight <= 500;
  const compact = layoutSetting === 'compact' || (layoutSetting !== 'full' && small);
  if (compact === isCompact) return;
  isCompact = compact;
  document.body.classList.toggle('compact', compact);
  // things that depend on the layout: QR size, banner scroll, built-in vs embedded weather
  renderedQrKey = null;
  renderEventsPage();
  lastBannerKey = null;
  if (currentBannerMessage) updateBannerTicker(currentBannerMessage, currentBannerTitle);
  applyWeatherMode();
  renderLeaderboardFromCache();
}
window.addEventListener('resize', () => {
  applyLayout();
  if (currentBannerMessage) updateBannerTicker(currentBannerMessage, currentBannerTitle);
  renderLeaderboardFromCache();
});

// The pasted weather widget is sized for a big panel, so the compact layout always uses the
// built-in text weather instead.
function applyWeatherMode() {
  const hasCode = !!(weatherEmbedCodeSetting && weatherEmbedCodeSetting.trim());
  const wasActive = weatherEmbedActive;
  weatherEmbedActive = hasCode && !isCompact;
  document.getElementById('weatherWidgetWrap').style.display = weatherEmbedActive ? 'flex' : 'none';
  document.getElementById('weatherContent').style.display = weatherEmbedActive ? 'none' : 'flex';
  if (weatherEmbedActive && weatherEmbedCodeSetting !== lastWeatherEmbedCode) {
    lastWeatherEmbedCode = weatherEmbedCodeSetting;
    mountEmbedCode('weatherWidgetWrap', weatherEmbedCodeSetting);
  }
  if (wasActive && !weatherEmbedActive) loadWeather();
}

// Tick boxes, layout choice and the extra embed widgets from /edit
function applyWidgetSettings(data) {
  layoutSetting = ['auto', 'full', 'compact'].includes(data.layout) ? data.layout : 'auto';
  applyLayout();

  const f = data.widgets || {};
  const prev = widgetFlags;
  widgetFlags = {
    leaderboard: f.leaderboard !== false,
    news: f.news !== false,
    events: f.events !== false,
    instagram: f.instagram !== false,
    uniform: f.uniform !== false,
    chainOfCommand: !!f.chainOfCommand
  };
  if (widgetFlags.leaderboard && !prev.leaderboard) loadLeaderboard();

  // News is the built-in BBC scrape – just ensure we (re)load when the widget is enabled
  if (widgetFlags.news && !prev.news) loadNews();

  // Instagram: only loaded while ticked (and it has an embed code)
  const igCode = (data.instagramEmbedCode || '').trim();
  if (widgetFlags.instagram && igCode) {
    if (data.instagramEmbedCode !== lastInstagramEmbedCode) {
      lastInstagramEmbedCode = data.instagramEmbedCode;
      mountInstagramEmbed(data.instagramEmbedCode);
    }
  } else if (lastInstagramEmbedCode) {
    lastInstagramEmbedCode = '';
    document.getElementById('instaWrap').innerHTML = '';
  }

  // Chain of Command people from settings
  const coc = data.chainOfCommand && Array.isArray(data.chainOfCommand.people) ? data.chainOfCommand.people : [];
  latestChainOfCommand = { people: coc };
  if (widgetFlags.chainOfCommand) renderChainOfCommand();

  syncCustomPanes(data.customWidgets);
}

// One pane per extra embed widget. Panes for deleted widgets are removed; an embed is only
// loaded while its widget is ticked, and only re-mounted when its code changes.
function syncCustomPanes(list) {
  customWidgets = Array.isArray(list) ? list : [];
  const panel = document.getElementById('rotatingPanel');
  const wanted = new Set(customWidgets.map(w => w.id));
  panel.querySelectorAll('.custom-pane').forEach(el => {
    if (!wanted.has(el.dataset.wid)) { el.remove(); delete customMounted[el.dataset.wid]; }
  });
  customWidgets.forEach(w => {
    const paneId = 'cw-' + w.id;
    let pane = document.getElementById(paneId);
    if (!pane) {
      pane = document.createElement('div');
      pane.id = paneId;
      pane.className = 'rotate-pane embed-pane custom-pane';
      pane.dataset.wid = w.id;
      const wrap = document.createElement('div');
      wrap.className = 'insta-wrap';
      wrap.id = paneId + '-wrap';
      pane.appendChild(wrap);
      panel.appendChild(pane);
    }
    const code = (w.embedCode || '').trim();
    if (w.enabled && code) {
      if (customMounted[w.id] !== code) { customMounted[w.id] = code; mountEmbedCode(paneId + '-wrap', code); }
    } else if (customMounted[w.id]) {
      delete customMounted[w.id];
      document.getElementById(paneId + '-wrap').innerHTML = '';
    }
  });
}

async function loadSettings() {
  try {
    const res = await fetch('/api/data', { cache: 'no-store' });
    if (!res.ok) throw new Error('settings HTTP ' + res.status);
    const data = await res.json();
    if (!data || typeof data !== 'object') throw new Error('settings response invalid');
    errorReportUrl = data.errorReportUrl || '';
    if (data.squadronName) document.getElementById('squadronName').textContent = data.squadronName;
    if (data.location && data.location.name) {
      document.getElementById('weatherLocationName').textContent = data.location.name;
    }

    applyWidgetSettings(data);

    weatherEmbedCodeSetting = data.weatherEmbedCode || '';
    applyWeatherMode();

    const info = data.importantInfo;
    const banner = document.getElementById('infoBanner');
    if (info && info.enabled && info.message && info.message.trim()) {
      currentBannerTitle = (info.title && info.title.trim()) || 'IMPORTANT INFORMATION';
      banner.classList.add('visible');
      currentBannerMessage = info.message.trim();
      updateBannerTicker(currentBannerMessage, currentBannerTitle);
    } else {
      banner.classList.remove('visible');
      currentBannerMessage = null;
      lastBannerKey = null;
    }

    if (!eventsLoaded) latestEvents = data.events || [];   // until /api/events answers (it adds the calendar)
    eventsSeeMoreUrl = data.eventsSeeMoreUrl || '';
    rebuildEventsPages();
    loadEvents();
    loadUniform();
    updatePanes();
  } catch (e) { console.error('settings load failed', e); }
}

async function loadWeather() {
  if (weatherEmbedActive) return;
  const box = document.getElementById('weatherContent');
  try {
    const w = await apiJson('/api/weather');
    if (!w.current) throw new Error('No current weather data returned');
    const c = w.current;
    box.innerHTML = `
      <div class="temp">${Math.round(c.temperature_2m)}&deg;</div>
      <div class="feels">Feels like ${Math.round(c.apparent_temperature ?? c.temperature_2m)}&deg;</div>
      <div class="condition">${WEATHER_CODES[c.weather_code] || 'Unknown'}</div>`;
    const ws = document.getElementById('weatherStamp');
    ws.textContent = w.updatedAt ? (w.stale ? 'Offline – data from ' : 'Updated ') + fmtClock(w.updatedAt) : '';
    ws.classList.toggle('stale', !!w.stale);
  } catch (e) {
    showError(box, 'weather', e.message || String(e));
  }
}

let cachedLb = null;
let lastLbKey = '';
function renderLeaderboardFromCache() {
  if (!widgetFlags.leaderboard || !cachedLb) return;
  const pane = ensurePaneSkeleton('lbPane');
  if (pane.querySelector('.error-box')) return;
  const indivBody = document.getElementById('lbIndividualBody');
  const flightBody = document.getElementById('lbFlightBody');
  const flightTable = document.getElementById('lbFlightTable');
  const flightUnavailable = document.getElementById('lbFlightUnavailable');
  if (!indivBody) return;

  // Fixed counts on all screen sizes: top 5 individual, top 3 flights
  const rows = (cachedLb.rows || []).slice(0, 5);
  const flightSrc = (cachedLb.flightRows || []).filter(r => {
    const k = String(r.flight || '').trim().toLowerCase();
    return k && k !== 'n/a' && k !== 'na' && k !== '-' && k !== 'none';
  }).slice(0, 3);
  const hasFlight = flightSrc.length > 0;
  const key = JSON.stringify([rows, flightSrc]);
  if (key === lastLbKey) return;
  lastLbKey = key;

  indivBody.innerHTML = rows.map((r, i) =>
    `<tr><td class="rank">${i+1}</td><td>${esc(r.name)}</td><td class="points">${esc(r.points)}</td></tr>`).join('');

  if (hasFlight) {
    flightTable.style.display = '';
    flightUnavailable.style.display = 'none';
    flightBody.innerHTML = flightSrc.map((r, i) =>
      `<tr><td class="rank">${i+1}</td><td>${esc(r.flight)}</td><td class="points">${esc(r.points)}</td></tr>`).join('');
  } else {
    flightTable.style.display = 'none';
    flightUnavailable.style.display = 'block';
  }
}

async function loadNews() {
  if (!widgetFlags.news) return;
  const list = document.getElementById('newsList');
  const stamp = document.getElementById('newsStamp');
  if (!list) return;
  try {
    const r = await apiJson('/api/news');
    const items = (r.items || []).slice(0, 3);
    if (!items.length) throw new Error('No headlines returned');
    list.innerHTML = items.map(item => {
      const title = esc(item.title || '');
      const desc = esc(item.description || '');
      const thumb = item.thumbnail
        ? '<img class="thumb" src="' + esc(item.thumbnail) + '" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">'
        : '<div class="thumb placeholder">BBC</div>';
      return '<article class="news-card">' +
        thumb +
        '<div class="body">' +
          '<div class="title">' + title + '</div>' +
          (desc ? '<div class="desc">' + desc + '</div>' : '') +
          '<div class="source">BBC News</div>' +
        '</div>' +
      '</article>';
    }).join('');
    if (stamp) {
      stamp.textContent = r.updatedAt ? ((r.stale ? 'Offline – data from ' : 'Updated ') + fmtClock(r.updatedAt)) : '';
      stamp.classList.toggle('stale', !!r.stale);
    }
    setStamp('newsPane', r.updatedAt, r.stale);
  } catch (e) {
    // Do not erase headlines that were already showing.
    if (list && list.querySelector('.news-card')) {
      if (stamp) { stamp.textContent = 'Offline – last headlines kept'; stamp.classList.add('stale'); }
    } else {
      list.innerHTML = '';
      if (stamp) { stamp.textContent = ''; stamp.classList.remove('stale'); }
      showError(list.parentElement || list, 'news', e.message || String(e));
    }
  }
}

async function loadLeaderboard() {
  if (!widgetFlags.leaderboard) return;
  const pane = ensurePaneSkeleton('lbPane');
  try {
    const lb = await apiJson('/api/leaderboard');
    if (!lb.rows || !lb.rows.length) throw new Error(lb.note || 'No leaderboard rows returned');
    cachedLb = lb;
    lastLbKey = '';
    setStamp('lbPane', lb.updatedAt, lb.stale);
    renderLeaderboardFromCache();
  } catch (e) {
    // Keep last good table; only show error if we never had data.
    if (cachedLb && cachedLb.rows && cachedLb.rows.length) {
      setStamp('lbPane', cachedLb.updatedAt, true);
      renderLeaderboardFromCache();
    } else {
      cachedLb = null;
      lastLbKey = '';
      showError(pane, 'leaderboard', e.message || String(e));
    }
  }
}

// ---- "Last updated" stamps (top right of the rotating panel) ----
// The server says when each source was last fetched successfully, and whether what it sent is old
// data being kept because the source can't be reached right now.
const paneStamps = {};
function fmtClock(ms) { return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }); }
function setStamp(paneId, updatedAt, stale, note) {
  paneStamps[paneId] = updatedAt
    ? { text: (stale ? 'Offline – showing data from ' : 'Updated ') + fmtClock(updatedAt), stale: !!stale }
    : (note ? { text: note, stale: true } : null);
  if (typeof panes !== 'undefined' && panes[paneIndex] && panes[paneIndex].id === paneId) renderStamp(paneId);
}
function renderStamp(paneId) {
  const s = paneStamps[paneId];
  const el = document.getElementById('rotatingStamp');
  el.textContent = s ? s.text : '';
  el.classList.toggle('stale', !!(s && s.stale));
}
function setTitle(text) { document.getElementById('rotatingTitleText').textContent = text; }

// ---- Events: typed events + the calendar feed, merged by the server ----
async function loadEvents() {
  try {
    const r = await apiJson('/api/events');
    latestEvents = r.events || [];
    eventsLoaded = true;
    const c = r.calendar || {};
    if (!c.configured) setStamp('eventsPane', null, false, null);
    else if (!c.ok) setStamp('eventsPane', null, false, 'Calendar offline');
    else setStamp('eventsPane', c.updatedAt, c.stale);
    renderEventsHighlight((r.events || []).find(e => e.source === 'calendar') || (r.events || [])[0] || null);
    updateSourceBanner(c);
    rebuildEventsPages();
  } catch (e) { console.error('events load failed', e); }
}

function renderEventsHighlight(h) {
  const el = document.getElementById('eventsHighlight');
  if (!el) return;
  if (!h || !h.title) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="next-highlight">' +
    '<div class="eyebrow">Up next</div>' +
    '<div class="title">' + esc(h.title) + '</div>' +
    '<div class="meta">' + esc([h.date, h.detail].filter(Boolean).join(' · ')) + '</div>' +
    '</div>';
}

function updateSourceBanner(cal) {
  const el = document.getElementById('sourceBanner');
  if (!el) return;
  if (!cal || !cal.configured) { el.classList.remove('show'); el.textContent = ''; return; }
  if (!cal.ok) {
    el.textContent = 'Calendar offline' + (cal.error ? ' — ' + cal.error : '') + '. Showing last known data where possible.';
    el.classList.add('show');
    return;
  }
  if (cal.stale) {
    const when = cal.updatedAt ? new Date(cal.updatedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
    el.textContent = 'Calendar feed is stale' + (when ? ' (last good update ' + when + ')' : '') + ' — board may be out of date.';
    el.classList.add('show');
    return;
  }
  el.classList.remove('show');
  el.textContent = '';
}

// ---- Uniform: this week / next week ----
let uniformSignature = '';
async function loadUniform() {
  if (!widgetFlags.uniform) return;
  try {
    const u = await apiJson('/api/uniform');
    latestUniform = { thisWeek: u.thisWeek || [], nextWeek: u.nextWeek || [] };
    const c = u.calendar || {};
    if (c.configured && c.ok) setStamp('uniformPane', c.updatedAt, c.stale);
    else if (c.configured) setStamp('uniformPane', null, false, 'Calendar offline');
    else setStamp('uniformPane', null, false, null);
    const sig = JSON.stringify(latestUniform);
    if (sig !== uniformSignature) { uniformSignature = sig; renderUniform(); }
    updatePanes();
  } catch (e) { console.error('uniform load failed', e); }
}
function renderUniform() {
  const col = (list, empty) => list.length
    ? list.map(x => `<div class="uni-item"><div class="uni-day">${esc(x.day)}${x.title ? ' &middot; ' + esc(x.title) : ''}</div><div class="uni-what">${esc(x.uniform)}</div></div>`).join('')
    : `<div class="uni-empty">${empty}</div>`;
  document.getElementById('uniThisList').innerHTML = col(latestUniform.thisWeek, 'Nothing more this week');
  document.getElementById('uniNextList').innerHTML = col(latestUniform.nextWeek, 'Not announced yet');
}
const hasUniform = () => latestUniform.thisWeek.length + latestUniform.nextWeek.length > 0;

function renderChainOfCommand() {
  const host = document.getElementById('cocTree');
  const people = (latestChainOfCommand && latestChainOfCommand.people) || [];
  if (!people.length) {
    host.innerHTML = '<div class="coc-empty">No chain of command set up yet.<br>Add people on the /edit page.</div>';
    return;
  }
  const byId = {};
  people.forEach(p => { byId[p.id] = { ...p, children: [] }; });
  const roots = [];
  people.forEach(p => {
    const node = byId[p.id];
    if (p.reportsTo && byId[p.reportsTo] && p.reportsTo !== p.id) {
      byId[p.reportsTo].children.push(node);
    } else {
      roots.push(node);
    }
  });
  function renderNode(node) {
    const initials = (node.name || '?').split(/\s+/).map(s => s[0] || '').join('').slice(0, 2).toUpperCase();
    const photoHtml = node.photo
      ? '<img class="coc-photo" src="' + String(node.photo).replace(/"/g, '&quot;') + '" alt="">'
      : '<div class="coc-photo placeholder">' + esc(initials) + '</div>';
    let html = '<div class="coc-node-wrap"><div class="coc-node">' +
      photoHtml +
      '<div class="coc-rank">' + esc(node.rank || '') + '</div>' +
      '<div class="coc-name">' + esc(node.name || '') + '</div>' +
      '</div>';
    if (node.children && node.children.length) {
      html += '<div class="coc-children">' + node.children.map(renderNode).join('') + '</div>';
    }
    html += '</div>';
    return html;
  }
  host.innerHTML = '<div class="coc-tree"><div class="coc-level">' + roots.map(renderNode).join('') + '</div></div>';
}

async function refreshAll() {
  await loadSettings();
  await loadWeather();
  await loadLeaderboard();
  await loadNews();
}
refreshAll();
setInterval(loadWeather, 10 * 60 * 1000);
setInterval(loadLeaderboard, 5 * 60 * 1000);
setInterval(loadNews, 10 * 60 * 1000);
setInterval(loadSettings, 15 * 1000); // checks for edits made on /edit every 15 seconds

// ---- Reload when the server restarts (e.g. after an auto-update) ----
let bootId = null;
let reloadId = null;
let noticeUntil = 0;
function showNotice(n) {
  const el = document.getElementById('notice');
  if (n && n.text) {
    document.getElementById('noticeText').textContent = n.text;   // text, never HTML
    noticeUntil = Date.now() + (n.secondsLeft || 0) * 1000;
    el.classList.add('visible');
  } else {
    noticeUntil = 0;
    el.classList.remove('visible');
  }
}
setInterval(() => { if (noticeUntil && Date.now() > noticeUntil) showNotice(null); }, 1000);
async function checkForRestart() {
  try {
    const b = await (await fetch('/api/boot', { cache: 'no-store' })).json();
    if (bootId === null) { bootId = b.id; reloadId = b.reload; }
    else if (b.id !== bootId || b.reload !== reloadId) location.reload();   // restarted, or "reload screens" pressed on /edit
    showNotice(b.notice);
  } catch (e) { /* server is restarting - try again next time */ }
}
checkForRestart();
setInterval(checkForRestart, 15 * 1000);

// ---- Carousel: rotates through the widgets that are ticked on /edit, every 10s ----
// Order: Leaderboard, News, Events, Uniform, Instagram, then the extra embed widgets in the order
// they were added. Anything unticked (or an embed widget with no code) is skipped.
let panes = [];
let paneIndex = 0;
let paneTimer = null;
let paneSignature = null;

function computePanes() {
  const list = [];
  if (widgetFlags.leaderboard) list.push({ id: 'lbPane', title: 'Leaderboard' });
  if (widgetFlags.news) list.push({ id: 'newsPane', title: 'News' });
  if (widgetFlags.events) list.push({ id: 'eventsPane', title: 'Latest Events' });
  if (widgetFlags.uniform && hasUniform()) list.push({ id: 'uniformPane', title: 'Uniform' });
  if (widgetFlags.instagram && lastInstagramEmbedCode) list.push({ id: 'socialsPane', title: 'Follow Us' });
  if (widgetFlags.chainOfCommand) list.push({ id: 'cocPane', title: 'Chain of Command' });
  customWidgets.forEach(w => {
    if (w.enabled && (w.embedCode || '').trim()) {
      list.push({ id: 'cw-' + w.id, title: (w.title || '').trim() || (w.name || '').trim() || 'Widget' });
    }
  });
  return list;
}

function showPane(i) {
  document.querySelectorAll('#rotatingPanel .rotate-pane').forEach(el => el.classList.remove('active'));
  const p = panes[i];
  if (!p) {
    document.getElementById('noWidgetsPane').classList.add('active');
    setTitle('Widgets');
    renderStamp('none');
    clearInterval(eventsTimer);
    return;
  }
  document.getElementById(p.id).classList.add('active');
  setTitle(p.title);
  renderStamp(p.id);
  if (p.id === 'eventsPane') startEventsRotation();
  else clearInterval(eventsTimer);
}

// Every pane gets 10s, except events which gets 10s per page of events
function paneDuration(i) {
  return panes[i] && panes[i].id === 'eventsPane' ? Math.max(1, eventsPages.length) * 10000 : 10000;
}
function scheduleNext() {
  clearTimeout(paneTimer);
  if (panes.length > 1) paneTimer = setTimeout(nextPane, paneDuration(paneIndex));
}
function nextPane() {
  paneIndex = (paneIndex + 1) % panes.length;
  showPane(paneIndex);
  scheduleNext();
}

// Called after every settings load. Only does anything when the list of panes (or a
// title) actually changed, so the rotation isn't disturbed every 10 seconds.
function updatePanes() {
  const next = computePanes();
  const signature = JSON.stringify(next);
  if (signature === paneSignature) return;
  paneSignature = signature;

  const currentId = panes[paneIndex] ? panes[paneIndex].id : null;
  panes = next;
  const keep = currentId ? panes.findIndex(p => p.id === currentId) : -1;
  if (keep >= 0) {
    paneIndex = keep;
    setTitle(panes[keep].title); // in case it was renamed
  } else {
    paneIndex = 0;
    showPane(0);
  }
  scheduleNext();
}

applyLayout();
</script>
