<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Updating – Squadron Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  :root {
    --navy: #00205B;
    --blue: #0066A1;
    --cream: #F4F6F8;
    --muted: #667788;
    --red: #C8102E;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--cream);
    color: var(--navy);
    font-family: "Inter", Arial, Helvetica, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    text-align: center;
  }
  .spinner {
    width: 56px; height: 56px;
    border: 4px solid #D5DDE5;
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin-bottom: 28px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 {
    margin: 0 0 10px;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 700;
  }
  #msg {
    margin: 0;
    max-width: 28em;
    font-size: clamp(15px, 2.4vw, 18px);
    color: var(--muted);
    line-height: 1.45;
    min-height: 2.6em;
  }
  #msg.err { color: var(--red); }
  .hint {
    margin-top: 28px;
    font-size: 13px;
    color: var(--muted);
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <h1>Updating</h1>
    <p id="msg">Please wait while the dashboard updates…</p>
    <p class="hint">The room screen will start when this finishes.</p>
  </div>
<script>
(function () {
  const msg = document.getElementById('msg');
  const spinner = document.getElementById('spinner');
  let bootAtStart = null;
  let sawRunning = false;
  let finishAt = 0;

  function setMsg(text, isErr) {
    msg.textContent = text || '';
    msg.className = isErr ? 'err' : '';
  }

  function goDashboard() {
    // Normal startup (Astro Labs loading screen) from here
    location.replace('/');
  }

  async function readJson(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }

  async function tick() {
    try {
      if (bootAtStart === null) {
        try {
          const b = await readJson('/api/boot');
          bootAtStart = b && b.id != null ? String(b.id) : '';
        } catch (e) {
          bootAtStart = '';
        }
      }

      const st = await readJson('/api/update/status');
      const state = String((st && st.state) || 'idle');
      const detail = (st && st.message) ? String(st.message) : '';

      if (state === 'running' || state === 'requested') {
        sawRunning = true;
        setMsg(detail || (state === 'requested' ? 'Update requested…' : 'Updating…'));
        return;
      }

      if (state === 'error') {
        setMsg(detail || 'Update failed — starting the dashboard.', true);
        if (!finishAt) finishAt = Date.now() + 6000;
        if (Date.now() >= finishAt) goDashboard();
        return;
      }

      // done / idle — if we never saw an update, leave immediately
      if (!sawRunning) {
        goDashboard();
        return;
      }

      setMsg(detail || 'Update finished — starting the dashboard…');

      // Server may restart after applying code; wait until it answers again.
      // If boot id changes, the new process is up. If restart-pending clears
      // and /api/boot still works, we're also good to continue.
      try {
        const b = await readJson('/api/boot');
        const id = b && b.id != null ? String(b.id) : '';
        const restarted = bootAtStart && id && id !== bootAtStart;
        const pending = !!(st && st.restartPending);
        if (restarted || !pending) {
          if (!finishAt) finishAt = Date.now() + 1200;
          if (Date.now() >= finishAt) goDashboard();
          return;
        }
        // Still pending a restart — keep waiting for the process to come back
        setMsg('Waiting for the dashboard service to restart…');
      } catch (e) {
        setMsg('Waiting for the dashboard service…');
      }
    } catch (e) {
      // Process down mid-update is normal
      sawRunning = true;
      setMsg('Updating — waiting for the server…');
    }
  }

  tick();
  setInterval(tick, 1500);
})();
</script>
</body>
</html>
